name: Deploy to VPS

on:
  push:
    branches:
      - "*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check root files
        run: |
          echo "Root files:"
          ls -la
          [ -f "index.html" ] && echo "✓ index.html exists" || echo "✗ index.html NOT found"

      - name: Deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: |
            index.html
            css/
            img/
            favicon.ico
          target: "/var/www/portfolio"
          rm: true