<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  // 1. Клик по миниатюре -> меняем главное фото в своём блоке
  let activeCategory = null;

  document.querySelectorAll(".category").forEach(category => {
    const mainImg = category.querySelector(".main-photo img");
    const thumbs = Array.from(category.querySelectorAll(".thumbs img"));
    let currentIndex = 0;

    if (thumbs.length > 0) {
      thumbs[0].classList.add("active");
    }

    function setActiveCategory() {
      activeCategory = category;
    }

    function showImage(index) {
      if (index < 0) index = thumbs.length - 1;
      if (index >= thumbs.length) index = 0;

      currentIndex = index;

      thumbs.forEach(t => t.classList.remove("active"));
      const thumb = thumbs[currentIndex];
      thumb.classList.add("active");

      mainImg.style.opacity = "0";

      setTimeout(() => {
        mainImg.src = thumb.src;
        mainImg.dataset.full = thumb.dataset.full;
        mainImg.style.opacity = "1";
      }, 600);
    }

    thumbs.forEach((thumb, index) => {
      thumb.addEventListener("click", () => {
        setActiveCategory();
        showImage(index);
      });
    });

    mainImg.addEventListener("click", () => {
      setActiveCategory();
    });

    // свайпы
    let startX = 0;
    let endX = 0;

    mainImg.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    });

    mainImg.addEventListener("touchend", e => {
      endX = e.changedTouches[0].clientX;
      handleSwipe();
    });

    function handleSwipe() {
      if (!activeCategory || activeCategory !== category) return;

      const diff = startX - endX;
      if (Math.abs(diff) < 50) return;

      if (diff > 0) {
        showImage(currentIndex + 1);
      } else {
        showImage(currentIndex - 1);
      }
    }

    // клавиатура
    document.addEventListener("keydown", e => {
      if (!activeCategory || activeCategory !== category) return;

      if (e.key === "ArrowRight") {
        showImage(currentIndex + 1);
      }

      if (e.key === "ArrowLeft") {
        showImage(currentIndex - 1);
      }
    });
  });


  // 2. Клик по главному фото -> открываем fullscreen
  document.querySelectorAll(".main-photo img").forEach(img => {
    img.addEventListener("click", () => {
      const fullSrc = img.dataset.full;
      lightboxImg.src = fullSrc;
      lightbox.classList.add("active");
    });
  });

  // 3. Закрытие fullscreen по клику
  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
    lightboxImg.src = "";
  });

  const heroImages = document.querySelectorAll(".hero-image");
  const prevBtn = document.querySelector(".hero-prev");
  const nextBtn = document.querySelector(".hero-next");
  const counter = document.querySelector(".hero-counter");

  let heroIndex = 0;
  let heroTimer = null;

  function updateCounter() {
    counter.textContent = `${heroIndex + 1} / ${heroImages.length}`;
  }

  function showHero(index) {
    heroImages.forEach(img => img.classList.remove("active"));

    if (index < 0) index = heroImages.length - 1;
    if (index >= heroImages.length) index = 0;

    heroIndex = index;
    heroImages[heroIndex].classList.add("active");
    updateCounter();
  }

  function nextHero() {
    showHero(heroIndex + 1);
  }

  function prevHero() {
    showHero(heroIndex - 1);
  }

  function startHeroAuto() {
    heroTimer = setInterval(nextHero, 5000);
  }

  function resetHeroAuto() {
    clearInterval(heroTimer);
    startHeroAuto();
  }

  nextBtn.addEventListener("click", () => {
    nextHero();
    resetHeroAuto();
  });

  prevBtn.addEventListener("click", () => {
    prevHero();
    resetHeroAuto();
  });

  showHero(0);
  startHeroAuto();

</script>
